name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # scan.py/deck.py claim to be pure-stdlib and portable; test the floor
        # (pyproject's target-version) and a current version, not just one.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest pyyaml ruff

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Test (pytest)
        # Includes tests/test_plugin_manifests.py, which validates plugin.json,
        # marketplace.json, and every SKILL.md's frontmatter — the structural
        # checks that `claude plugin validate` performs, runnable without the CLI.
        run: python -m pytest tests/ -q

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runs the same hooks defined in .pre-commit-config.yaml, so what's
      # documented for local use is also enforced in CI.
      - uses: pre-commit/action@v3.0.1

  plugin-validate:
    # Best-effort: exercises the real `claude plugin validate` CLI as a second
    # opinion alongside tests/test_plugin_manifests.py (the enforced, no-auth
    # equivalent). Skips itself when no API key secret is configured, and
    # never fails the build on its own.
    #
    # Note: the "skip if no secret" check happens INSIDE the step below, not
    # in a job-level `if:` — the `secrets` context is not permitted there
    # (GitHub Actions rejects the whole workflow file if it is).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret configured — skipping (optional job)."
            exit 0
          fi
          claude plugin validate .
