# Optional local hooks: `pip install pre-commit && pre-commit install`.
# Run `pre-commit autoupdate` to bump the pinned revisions.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Markdown may use two trailing spaces for a hard line break; .editorconfig
        # makes the same exception (trim_trailing_whitespace = false for *.md).
        exclude: \.md$
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
